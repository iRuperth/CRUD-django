<!DOCTYPE html>
<html>

<head>
    <title>Delete {{ book.name }}</title>
</head>

<body>
    <h1>Delete {{ book.name }}</h1>
    <p>Are you sure you want to delete this book?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'book_list' %}">Cancel</a>
</body>

</html>
